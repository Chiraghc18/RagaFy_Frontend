
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

  <defs>
    <linearGradient id="background"
      x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19366F"/>
      <stop offset="100%" stop-color="#080F27"/>
    </linearGradient>

    <linearGradient id="orange"
      x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB04A"/>
      <stop offset="100%" stop-color="#FF6500"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="15"
        fill="url(#background)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="62" height="62" rx="14"
        fill="none" stroke="#4265A5"
        stroke-opacity=".45"/>

  <!-- Sound wave -->
  <g fill="url(#orange)" filter="url(#glow)">
    <rect x="10" y="27" width="5" height="10" rx="2.5"/>
    <rect x="19" y="19" width="5" height="26" rx="2.5"/>
    <rect x="28" y="13" width="5" height="38" rx="2.5"/>
    <rect x="37" y="21" width="5" height="22" rx="2.5"/>
    <rect x="46" y="26" width="5" height="12" rx="2.5"/>
  </g>

</svg>
